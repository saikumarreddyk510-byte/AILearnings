<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Page</title>
</head>
<body>
    <h1>Login Page</h1>
    {% if login_success %}
    <p>Welcome back, {{ username }}! Login successful.</p>
    {% else %}
    <p>Invalid username or password. Please try again, {{ username }}.</p>
    {% endif %}
</body>
</html>
